name: Relay checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: relay-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  next:
    name: Relay Next / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Type checks
        run: npm run check
      - name: Isolated tests (no model credentials)
        run: npm test
      - name: Two-connector demonstration
        run: npm run demo
      - name: Remote MCP with official clients and local Cloudflare Worker
        run: npm run test:remote-mcp-worker
      - name: Verify package contents
        run: npm pack --dry-run
      - name: Install package and verify guided setup
        run: npm run test:package-setup
      - name: Build npm release archive
        if: matrix.os == 'ubuntu-latest'
        run: npm run package:release
      - name: Build desktop setup with bundled runtime
        run: npm run build:desktop
      - name: Save desktop alpha packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: relay-setup-${{ matrix.os }}
          path: .relay/releases/*
          include-hidden-files: true
          if-no-files-found: error
