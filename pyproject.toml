[project]
name = "relay-workspace"
version = "0.6.2"
description = "Transfer the understanding behind your code."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
relay = "relay.__main__:main"
relay-workspace = "relay.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
relay = ["web/*"]

[tool.setuptools.packages.find]
include = ["relay*"]
